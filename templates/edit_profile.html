{% extends "base.html" %}

{% block content %}

<h2>✏️ プロフィール編集</h2>

<form method="POST" enctype="multipart/form-data">

    <label>プロフィール画像</label><br>

    <input type="file" name="profile_image">

    <br><br>

    <label>自己紹介</label><br>
    <textarea
        name="bio"
        rows="5"
        cols="40"
    >{{ user['bio'] or '' }}</textarea><br><br>

    <button type="submit">保存</button>

</form>

{% endblock %}
