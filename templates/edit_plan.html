{% extends "base.html" %}

{% block content %}

<h1>✏️ 予定を編集</h1>

<form method="POST">

    <p>日付</p>
    <input type="date" name="date" value="{{ plan[0] }}" required>

    <p>科目</p>
    <input type="text" name="subject" value="{{ plan[1] }}" required>

    <p>予定時間（分）</p>
    <input type="number" name="minutes" value="{{ plan[2] }}" required>

    <br><br>

    <button type="submit">💾 保存</button>
    <a href="{{ url_for('plans') }}">
        <button type="button">↩️ 戻る</button>
    </a>

</form>

{% endblock %}
