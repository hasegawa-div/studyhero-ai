{% extends "base.html" %}

{% block content %}

<h2>👤 {{ user["username"] }}</h2>

{% if user["profile_image"] %}
<img src="{{ url_for('static', filename='uploads/' + user['profile_image']) }}"
     width="150"
     style="border-radius:50%;">
{% endif %}

<p>{{ user["bio"] }}</p>

{% endblock %}
